[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-api"
version = "0.1.0"
description = "Hermes Control Plane API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "httpx>=0.27",
  "docker>=7.1",
  "python-multipart>=0.0.9",
  "cryptography>=42.0",
  "hermes-types",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
hermes-types = { path = "../../packages/shared-types" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
