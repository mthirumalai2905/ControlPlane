[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-types"
version = "0.1.0"
description = "Shared Pydantic types for Hermes Control Plane"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_types"]
